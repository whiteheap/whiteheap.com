<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Whiteheap">
  <!-- Favicon simplification: solid tier bars (no per-cell gutters) for legibility at 16–32px.
       Same 5/7/11 stepped silhouette as master mark. Documented intentional simplification. -->
  <rect width="32" height="32" fill="#000"/>
  <g fill="#fff">
    <rect x="10" y="5" width="11" height="6"/>
    <rect x="8" y="13" width="15" height="6"/>
    <rect x="4" y="21" width="24" height="6"/>
  </g>
</svg>
